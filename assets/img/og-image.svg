<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A2E"/>
      <stop offset="50%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#1B3A5C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00B8E0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glow effects -->
  <circle cx="200" cy="150" r="200" fill="url(#accent)" opacity="0.15" filter="blur(40px)"/>
  <circle cx="1000" cy="500" r="180" fill="url(#accent)" opacity="0.1" filter="blur(40px)"/>
  
  <!-- Logo icon -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="url(#accent)"/>
  <text x="120" y="138" font-family="Arial, sans-serif" font-size="52" font-weight="900" 
        text-anchor="middle" fill="#0A2540">S</text>
  
  <!-- Brand name -->
  <text x="180" y="135" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">سئو تور</text>
  <text x="180" y="160" font-family="Arial, sans-serif" font-size="16" fill="#00D4FF" letter-spacing="2">SEOTOUR.IR</text>
  
  <!-- Main headline -->
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="white">خدمات حرفه‌ای سئو</text>
  <text x="80" y="385" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="url(#accent)">و بهینه‌سازی وب‌سایت</text>
  
  <!-- Subtitle -->
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.7)">سئو فنی • سئو محتوایی • سئو وردپرس • لینک بیلدینگ</text>
  
  <!-- Stats -->
  <g transform="translate(80, 510)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#00D4FF">۱۵۰+</text>
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">پروژه موفق</text>
    
    <text x="180" y="30" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#00D4FF">۹۵٪</text>
    <text x="180" y="60" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">رضایت مشتری</text>
    
    <text x="360" y="30" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#00D4FF">۸ سال</text>
    <text x="360" y="60" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">تجربه</text>
  </g>
</svg>
